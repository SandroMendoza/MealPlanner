name: PR check

on:
  pull_request:
    branches: [development, test, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The release build runs R8, which catches failures a debug build doesn't. Without the
      # RELEASE_* signing values it is built unsigned, so no secrets are needed.
      - name: Build
        run: ./gradlew :shared:compileKotlinMetadata :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Test
        run: ./run-tests.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'
          if-no-files-found: ignore
